  <text x="1055" y="800" fill="#F7F8F4" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Uložit výsledek</text>
  <text x="130" y="845" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="18">Konkrétní akce · přesné jednotky · srozumitelné následky · respekt k začátečníkům</text>
