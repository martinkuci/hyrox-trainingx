  <text x="790" y="548" fill="#F7F8F4" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">Další blok za 00:30</text>
  <text x="790" y="590" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="18">Klidný trenér. Krátké pokyny. Žádné prázdné slogany.</text>

  <rect x="80" y="685" width="1280" height="195" rx="36" fill="#14171A" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="2"/>
