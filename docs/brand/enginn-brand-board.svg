<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Enginn brand board</title>
  <desc id="desc">Přehled značky Enginn, symbolu, barev, typografie a tónu komunikace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15191D"/>
      <stop offset="1" stop-color="#090A0C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(330 265) rotate(52) scale(430 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BEF264" stop-opacity=".18"/>
      <stop offset="1" stop-color="#BEF264" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="960" fill="url(#bg)"/>
  <rect width="1440" height="960" fill="url(#glow)"/>
  <text x="80" y="92" fill="#BEF264" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="5">BRAND SYSTEM · 1B</text>
  <text x="80" y="145" fill="#F7F8F4" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Hybridní trénink bez chaosu.</text>

  <rect x="80" y="205" width="620" height="430" rx="42" fill="#111417" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="2"/>
  <rect x="140" y="270" width="218" height="218" rx="50" fill="#090A0C" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="3"/>
