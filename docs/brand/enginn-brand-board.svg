  <text x="406" y="430" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Plán. Trénink. Výsledky.</text>
  <line x1="140" y1="540" x2="640" y2="540" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>
  <text x="140" y="585" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="18">E-rail · pohyb, struktura, tři části hlavního toku</text>

  <rect x="740" y="205" width="620" height="430" rx="42" fill="#14171A" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="2"/>
  <text x="790" y="265" fill="#F7F8F4" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Základní paleta</text>
  <circle cx="835" cy="345" r="45" fill="#BEF264"/>
  <circle cx="965" cy="345" r="45" fill="#090A0C" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="2"/>
  <circle cx="1095" cy="345" r="45" fill="#202429"/>
  <circle cx="1225" cy="345" r="45" fill="#F7F8F4"/>
