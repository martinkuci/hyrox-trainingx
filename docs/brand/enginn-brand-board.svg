  <text x="925" y="420" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="15">CARBON</text>
  <text x="1062" y="420" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="15">STEEL</text>
  <text x="1190" y="420" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="15">SIGNAL</text>
